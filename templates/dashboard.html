<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Running Agent - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* --- CSS DAL TASK 2.2 (Temi Telegram e Responsive) --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        h2 { 
            color: var(--tg-theme-button-color, #2481cc); 
            margin: 0 0 8px 0;
            font-size: 1.4em;
        }
        .weight-badge {
            display: inline-block;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-hint-color, #999);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .chart-card {
            background-color: var(--tg-theme-bg-color);
            border: 1px solid var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📊 Dashboard Allenamenti</h2>
        <div class="weight-badge" id="weight-display">Peso: -- kg</div>
    </div>

    <div id="loading" style="text-align: center; margin-top: 50px;">
        <p>⏳ Sincronizzazione allenamenti in corso...</p>
    </div>

    <div id="charts-wrapper" style="display: none;">
        <div class="chart-card">
            <div class="chart-container"><canvas id="kmChart"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="chart-container"><canvas id="paceChart"></canvas></div>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT DAL TASK 2.3 (Logica di fetch e render) ---
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function loadDashboardData() {
            try {
                // Esegue la chiamata API al nostro backend
                const response = await fetch('/api/metrics');
                const res = await response.json();

                if (res.status === 'success') {
                    // Nasconde il loading e mostra i grafici
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('charts-wrapper').style.display = 'block';

                    // Disegna i grafici passando i dati
                    renderCharts(res.data);
                    
                    // Aggiorna il peso se presente
                    if(res.data.latest_weight > 0) {
                        document.getElementById('weight-display').innerText = `Peso Attuale: ${res.data.latest_weight} kg`;
                    }
                } else {
                    showError("Errore dal server: " + res.message);
                }
            } catch (error) {
                showError("Impossibile connettersi al server. Riprova più tardi.");
                console.error("Fetch error:", error);
            }
        }

        function renderCharts(data) {
            // Preleva i colori dal tema attuale di Telegram
            const textColor = getComputedStyle(document.body).getPropertyValue('--tg-theme-text-color') || '#222';
            const primaryColor = getComputedStyle(document.body).getPropertyValue('--tg-theme-button-color') || '#2481cc';
            
            Chart.defaults.color = textColor;
            Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';

            // 1. GRAFICO CHILOMETRI
            new Chart(document.getElementById('kmChart'), {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Distanza (km)',
                        data: data.kilometers,
                        backgroundColor: primaryColor,
                        borderRadius: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: 'Volume (ultime 15 corse)', color: textColor }
                    },
                    scales: {
                        x: { grid: { color: 'rgba(150, 150, 150, 0.1)' }, ticks: { color: textColor } },
                        y: { grid: { color: 'rgba(150, 150, 150, 0.1)' }, ticks: { color: textColor } }
                    }
                }
            });

            // 2. GRAFICO PASSO
            new Chart(document.getElementById('paceChart'), {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Passo (min/km)',
                        data: data.paces,
                        borderColor: '#ff9500',
                        backgroundColor: 'rgba(255, 149, 0, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: 'Andamento del Passo', color: textColor }
                    },
                    scales: { 
                        x: { grid: { color: 'rgba(150, 150, 150, 0.1)' }, ticks: { color: textColor } },
                        y: { 
                            reverse: true, // I passi più veloci (numeri più bassi) vanno in alto
                            grid: { color: 'rgba(150, 150, 150, 0.1)' },
                            ticks: { color: textColor }
                        }
                    }
                }
            });
        }

        function showError(msg) {
            document.getElementById('loading').innerHTML = `<p style="color: red;">❌ ${msg}</p>`;
        }

        // Avvia la sincronizzazione appena la pagina si apre
        loadDashboardData();
    </script>
</body>
</html>
