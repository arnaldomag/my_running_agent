<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Running Agent - Dashboard</title>
    <script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/chart.js](https://cdn.jsdelivr.net/npm/chart.js)"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 { 
            color: var(--tg-theme-button-color, #2481cc); 
            margin: 0 0 8px 0;
            font-size: 1.4em;
        }

        .weight-badge {
            display: inline-block;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-hint-color, #999);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .chart-card {
            background-color: var(--tg-theme-bg-color);
            border: 1px solid var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .chart-container {
            position: relative;
            height: 220px; /* Altezza fissa per garantire stabilità su mobile */
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📊 Dashboard Allenamenti</h2>
        <div class="weight-badge" id="weight-display">Peso: -- kg</div>
    </div>

    <div class="chart-container">
        <canvas id="kmChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="paceChart"></canvas>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Espande l'app a schermo intero

        // Configurazione base per i colori tematici di Telegram
        const textColor = getComputedStyle(document.body).getPropertyValue('--tg-theme-text-color') || '#222';
        const primaryColor = getComputedStyle(document.body).getPropertyValue('--tg-theme-button-color') || '#2481cc';
        
        // Imposta i font predefiniti per Chart.js
        Chart.defaults.color = textColor;
        Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';

        // Fetch dei dati dal nostro backend
        fetch('/api/metrics')
            .then(response => response.json())
            .then(res => {
                if(res.status === 'success') {
                    const data = res.data;
                    
                    // Popola il badge del peso
                    if(data.latest_weight > 0) {
                        document.getElementById('weight-display').innerText = `Peso Attuale: ${data.latest_weight} kg`;
                    }

                    // 1. GRAFICO DEI CHILOMETRI (BARRE)
                    const ctxKm = document.getElementById('kmChart').getContext('2d');
                    new Chart(ctxKm, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Distanza (km)',
                                data: data.kilometers,
                                backgroundColor: primaryColor,
                                borderRadius: 5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                title: { display: true, text: 'Volume (ultime 15 corse)', color: textColor }
                            }
                        }
                    });

                    // 2. GRAFICO DEL PASSO (LINEA)
                    const ctxPace = document.getElementById('paceChart').getContext('2d');
                    new Chart(ctxPace, {
                        type: 'line',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Passo (min/km decimale)',
                                data: data.paces,
                                borderColor: '#ff9500', // Un bell'arancione per contrasto
                                backgroundColor: 'rgba(255, 149, 0, 0.2)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3 // Rende le curve morbide
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                title: { display: true, text: 'Andamento del Passo', color: textColor }
                            },
                            scales: {
                                x: {
                                    grid: {
                                        color: 'rgba(150, 150, 150, 0.1)' // Griglia leggerissima e semitrasparente
                                    },
                                    ticks: {
                                        color: textColor // Colore dinamico Telegram per le date
                                    }
                                },
                                y: {
                                    grid: {
                                        color: 'rgba(150, 150, 150, 0.1)'
                                    },
                                    ticks: {
                                        color: textColor // Colore dinamico Telegram per i valori (km/passo)
                                    }
                                }
                            }
                        }
                    });
                } else {
                    console.error("Errore API:", res.message);
                }
            })
            .catch(err => console.error("Errore di rete:", err));
    </script>
</body>
</html>
